<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>服务器设置</title>
  <style>
    :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; padding: 34px; background: #f8fafc; color: #0f172a; }
    h1 { margin: 0 0 8px; font-size: 24px; } p { margin: 0; color: #64748b; font-size: 13px; line-height: 1.6; }
    label { display: block; margin: 26px 0 8px; font-size: 13px; font-weight: 650; }
    input { box-sizing: border-box; width: 100%; border: 1px solid #cbd5e1; border-radius: 10px; padding: 12px; font-size: 14px; background: white; color: #0f172a; outline: none; }
    input:focus { border-color: #6366f1; box-shadow: 0 0 0 3px #6366f122; }
    #error { min-height: 20px; margin-top: 8px; color: #dc2626; }
    .actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }
    button { border: 0; border-radius: 9px; padding: 10px 18px; font-weight: 650; cursor: pointer; }
    .cancel { background: #e2e8f0; color: #334155; } .save { background: #4f46e5; color: white; }
    @media (prefers-color-scheme: dark) { body { background: #0f172a; color: #f8fafc; } p { color: #94a3b8; } input { border-color: #475569; background: #1e293b; color: white; } .cancel { background: #334155; color: #e2e8f0; } }
  </style>
</head>
<body>
  <h1>连接 Code Studio</h1>
  <p>请输入平台的 Web 地址。客户端会使用该地址访问页面及 API，建议生产环境使用 HTTPS。</p>
  <form id="form">
    <label for="serverUrl">服务器地址</label>
    <input id="serverUrl" type="url" required placeholder="https://code.example.com" spellcheck="false" />
    <p id="error"></p>
    <div class="actions"><button class="cancel" type="button" id="cancel">取消</button><button class="save" type="submit">保存并连接</button></div>
  </form>
  <script>
    const input = document.getElementById('serverUrl');
    const error = document.getElementById('error');
    window.desktopSettings.getServerUrl().then((value) => { input.value = value; input.select(); });
    document.getElementById('cancel').addEventListener('click', () => window.desktopSettings.cancel());
    document.getElementById('form').addEventListener('submit', async (event) => {
      event.preventDefault(); error.textContent = '';
      const result = await window.desktopSettings.saveServerUrl(input.value);
      if (!result.ok) error.textContent = result.message;
    });
  </script>
</body>
</html>
