apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "codegen.fullname" . }}-worker
  labels:
    {{- include "codegen.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  revisionHistoryLimit: {{ .Values.worker.revisionHistoryLimit }}
  progressDeadlineSeconds: {{ .Values.worker.progressDeadlineSeconds }}
  {{- if not .Values.worker.autoscaling.enabled }}
  replicas: {{ .Values.worker.replicaCount }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels:
      {{- include "codegen.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "codegen.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if not .Values.secrets.existingSecret }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "codegen.serviceAccountName" . }}
      automountServiceAccountToken: {{ eq .Values.runtime.generationExecutor "kubernetes" }}
      terminationGracePeriodSeconds: 1800
      imagePullSecrets: {{ toYaml .Values.imagePullSecrets | nindent 8 }}
      securityContext:
        seccompProfile: { type: RuntimeDefault }
        {{- if not .Values.runtime.dockerSocket.enabled }}
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        {{- end }}
      containers:
        - name: worker
          image: "{{ .Values.worker.image.repository }}:{{ .Values.worker.image.tag }}"
          imagePullPolicy: {{ .Values.worker.image.pullPolicy }}
          command: ["node", "--require", "./apps/api/dist/instrumentation.js", "apps/api/dist/worker-main.js"]
          envFrom:
            - configMapRef: { name: {{ include "codegen.fullname" . }} }
            - secretRef: { name: {{ include "codegen.secretName" . }} }
          env:
            - { name: PROCESS_ROLE, value: worker }
            - { name: BUILD_IMAGE, value: "{{ .Values.worker.image.repository }}:{{ .Values.worker.image.tag }}" }
            - { name: WORKER_HEALTH_PORT, value: {{ .Values.service.workerHealthPort | quote }} }
            - { name: AGENT_WORKER_CONCURRENCY, value: {{ .Values.worker.concurrency | quote }} }
            - { name: OTEL_SERVICE_NAME, value: codegen-worker }
          ports:
            - { name: health, containerPort: {{ .Values.service.workerHealthPort }}, protocol: TCP }
          startupProbe:
            httpGet: { path: /health/live, port: health }
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health/live, port: health }
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /health/ready, port: health }
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            readOnlyRootFilesystem: false
            {{- if not .Values.runtime.dockerSocket.enabled }}
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            {{- end }}
          volumeMounts:
            - { name: workspace, mountPath: /data }
            {{- if .Values.runtime.dockerSocket.enabled }}
            - { name: docker-socket, mountPath: /var/run/docker.sock }
            {{- end }}
      volumes:
        - name: workspace
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim: { claimName: {{ include "codegen.workspaceClaim" . }} }
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if .Values.runtime.dockerSocket.enabled }}
        - name: docker-socket
          hostPath: { path: {{ .Values.runtime.dockerSocket.path }}, type: Socket }
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{ toYaml . | nindent 8 }}
      {{- else }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "codegen.selectorLabels" . | nindent 20 }}
                    app.kubernetes.io/component: worker
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints: {{ toYaml . | nindent 8 }}
      {{- else }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "codegen.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: worker
      {{- end }}
