{{- if and (not .Values.secrets.existingSecret) (not .Values.externalSecrets.enabled) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "codegen.secretName" . }}
  labels:
    {{- include "codegen.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ required "secrets.databaseUrl 或 secrets.existingSecret 必须配置" .Values.secrets.databaseUrl | quote }}
  JWT_SECRET: {{ required "secrets.jwtSecret 或 secrets.existingSecret 必须配置" .Values.secrets.jwtSecret | quote }}
  JWT_KEY_ID: {{ .Values.secrets.jwtKeyId | quote }}
  JWT_PREVIOUS_SECRETS: {{ .Values.secrets.jwtPreviousSecrets | quote }}
  INITIAL_ADMIN_TOKEN: {{ .Values.secrets.initialAdminToken | quote }}
  CRED_ENCRYPTION_KEY: {{ required "secrets.credentialEncryptionKey 或 secrets.existingSecret 必须配置" .Values.secrets.credentialEncryptionKey | quote }}
  CRED_ENCRYPTION_KEY_ID: {{ .Values.secrets.credentialEncryptionKeyId | quote }}
  CRED_ENCRYPTION_PREVIOUS_KEYS: {{ .Values.secrets.credentialEncryptionPreviousKeys | quote }}
  REDIS_USERNAME: {{ .Values.secrets.redisUsername | quote }}
  REDIS_PASSWORD: {{ .Values.secrets.redisPassword | quote }}
  OPENSEARCH_USERNAME: {{ .Values.secrets.opensearchUsername | quote }}
  OPENSEARCH_PASSWORD: {{ .Values.secrets.opensearchPassword | quote }}
  OTEL_EXPORTER_OTLP_HEADERS: {{ .Values.secrets.otelHeaders | quote }}
  PROMETHEUS_USERNAME: {{ .Values.secrets.prometheusUsername | quote }}
  PROMETHEUS_PASSWORD: {{ .Values.secrets.prometheusPassword | quote }}
  PROMETHEUS_BEARER_TOKEN: {{ .Values.secrets.prometheusBearerToken | quote }}
  KAFKA_SASL_USERNAME: {{ .Values.secrets.kafkaSaslUsername | quote }}
  KAFKA_SASL_PASSWORD: {{ .Values.secrets.kafkaSaslPassword | quote }}
  KAFKA_SSL_CA: {{ .Values.secrets.kafkaSslCa | quote }}
  KAFKA_SSL_CERT: {{ .Values.secrets.kafkaSslCert | quote }}
  KAFKA_SSL_KEY: {{ .Values.secrets.kafkaSslKey | quote }}
  PREVIEW_ROUTING_CONTROL_TOKEN: {{ required "secrets.previewRoutingControlToken 或 secrets.existingSecret 必须配置" .Values.secrets.previewRoutingControlToken | quote }}
{{- end }}
