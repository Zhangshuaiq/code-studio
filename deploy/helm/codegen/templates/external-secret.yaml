{{- if .Values.externalSecrets.enabled }}
apiVersion: {{ .Values.externalSecrets.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ include "codegen.fullname" . }}
  labels:
    {{- include "codegen.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ required "externalSecrets.secretStoreRef.name 必须配置" .Values.externalSecrets.secretStoreRef.name }}
    kind: {{ .Values.externalSecrets.secretStoreRef.kind }}
  target:
    name: {{ include "codegen.secretName" . }}
    creationPolicy: Owner
  data:
    {{- range $secretKey, $remoteProperty := .Values.externalSecrets.dataMappings }}
    - secretKey: {{ $secretKey }}
      remoteRef:
        key: {{ $.Values.externalSecrets.remoteKey }}
        property: {{ $remoteProperty }}
    {{- end }}
{{- end }}
