apiVersion: v1
kind: Namespace
metadata:
  name: codegen-observability
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-state-metrics
  namespace: codegen-observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: codegen-kube-state-metrics
rules:
  - apiGroups: [""]
    resources: [configmaps, secrets, nodes, pods, services, resourcequotas, replicationcontrollers, limitranges, persistentvolumeclaims, persistentvolumes, namespaces, endpoints]
    verbs: [list, watch]
  - apiGroups: [apps]
    resources: [daemonsets, deployments, replicasets, statefulsets]
    verbs: [list, watch]
  - apiGroups: [batch]
    resources: [cronjobs, jobs]
    verbs: [list, watch]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, networkpolicies]
    verbs: [list, watch]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [list, watch]
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses, volumeattachments]
    verbs: [list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: codegen-kube-state-metrics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: codegen-kube-state-metrics
subjects:
  - kind: ServiceAccount
    name: kube-state-metrics
    namespace: codegen-observability
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics
  namespace: codegen-observability
spec:
  replicas: 1
  selector:
    matchLabels: { app: codegen-kube-state-metrics }
  template:
    metadata:
      labels: { app: codegen-kube-state-metrics }
    spec:
      serviceAccountName: kube-state-metrics
      containers:
        - name: kube-state-metrics
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.19.1
          args: ["--port=8080", "--telemetry-port=8081"]
          ports:
            - { name: metrics, containerPort: 8080 }
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { cpu: 200m, memory: 256Mi }
          readinessProbe: { httpGet: { path: /, port: 8080 }, initialDelaySeconds: 5, periodSeconds: 10 }
---
apiVersion: v1
kind: Service
metadata:
  name: kube-state-metrics
  namespace: codegen-observability
spec:
  type: NodePort
  selector: { app: codegen-kube-state-metrics }
  ports:
    - { name: metrics, port: 8080, targetPort: metrics, nodePort: 30080 }
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: cadvisor
  namespace: codegen-observability
spec:
  selector:
    matchLabels: { app: codegen-cadvisor }
  template:
    metadata:
      labels: { app: codegen-cadvisor }
    spec:
      automountServiceAccountToken: false
      hostNetwork: true
      containers:
        - name: cadvisor
          image: ghcr.io/google/cadvisor:v0.60.5
          args: ["--docker_only=true", "--housekeeping_interval=15s", "--port=18080"]
          securityContext: { privileged: true }
          ports:
            - { name: metrics, containerPort: 18080, hostPort: 18080 }
          volumeMounts:
            - { name: rootfs, mountPath: /rootfs, readOnly: true }
            - { name: run, mountPath: /var/run, readOnly: true }
            - { name: sys, mountPath: /sys, readOnly: true }
            - { name: docker, mountPath: /var/lib/docker, readOnly: true }
          resources:
            requests: { cpu: 50m, memory: 100Mi }
            limits: { cpu: 500m, memory: 512Mi }
      volumes:
        - { name: rootfs, hostPath: { path: / } }
        - { name: run, hostPath: { path: /var/run } }
        - { name: sys, hostPath: { path: /sys } }
        - { name: docker, hostPath: { path: /var/lib/docker } }
---
apiVersion: v1
kind: Service
metadata:
  name: cadvisor
  namespace: codegen-observability
spec:
  type: NodePort
  selector: { app: codegen-cadvisor }
  ports:
    - { name: metrics, port: 18080, targetPort: metrics, nodePort: 30081 }
