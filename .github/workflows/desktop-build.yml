name: Desktop packages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

# Keep every push; do not cancel earlier builds when another commit arrives.
jobs:
  package:
    name: Package ${{ matrix.platform }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            platform: macos
            arch: x64
            script: dist:mac
          - runner: macos-15
            platform: macos
            arch: arm64
            script: dist:mac
          - runner: windows-2022
            platform: windows
            arch: x64
            script: dist:win
    defaults:
      run:
        shell: bash
    env:
      # Push builds are test packages: no signing credentials or auto-publish.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.19.0'
          cache: npm
      - name: Cache verified language tools
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            apps/desktop/.cache/jdtls
            apps/desktop/.cache/java-tools
          key: desktop-language-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('packages/code-intelligence/scripts/install-*.cjs') }}
      - name: Install locked dependencies
        run: npm ci
      - name: Packaging configuration tests
        run: node --test apps/desktop/test/desktop-release.test.cjs
      - name: Build desktop packages
        run: npm run ${{ matrix.script }} --workspace apps/desktop -- --${{ matrix.arch }} --publish never
      - name: Verify package outputs and write checksums
        run: node apps/desktop/scripts/verify-release.cjs ${{ matrix.platform }} ${{ matrix.arch }}
      - name: Upload desktop packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Code-Studio-${{ matrix.platform }}-${{ matrix.arch }}-${{ github.sha }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*-Setup.exe
            apps/desktop/release/*-Portable.exe
            apps/desktop/release/SHA256SUMS.txt
            apps/desktop/release/build-info.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
